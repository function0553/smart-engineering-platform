<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4G 主码流 · 算法预览</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#0a1019;color:#e8edf4}*{box-sizing:border-box}body{margin:0;padding:20px;max-width:1680px;margin-inline:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}h1{font-size:22px;margin:0}.sub{color:#92a1b6;margin-top:5px;font-size:13px}button{background:#152339;border:1px solid #33435b;border-radius:7px;color:#e8edf4;padding:9px 14px;cursor:pointer}button:hover{border-color:#6bbcf5}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.panel{background:#111b2b;border:1px solid #243248;border-radius:10px;overflow:hidden}.stage{width:100%;aspect-ratio:16/9;background:#000;position:relative}.stage:fullscreen{aspect-ratio:auto;height:100vh}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}canvas{pointer-events:none}.bar{display:flex;gap:14px;flex-wrap:wrap;padding:13px;font-size:13px;color:#adbacd}.badge{color:#8ad5ad}.side{padding:17px}.side h2{font-size:16px;margin:0 0 12px}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #263449;padding:10px 0;font-size:13px;gap:10px}.metric span{color:#94a5ba}.metric strong{font-weight:500;text-align:right;word-break:break-all}.note{font-size:12px;color:#e0bb7b;line-height:1.7;margin-top:17px}pre{font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:#b8c6d8;max-height:300px;overflow:auto}.error{color:#ffae94}@media(max-width:950px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:10px}.side h2,.note,pre{grid-column:1/-1}body{padding:12px}h1{font-size:18px}}
</style>
<script defer src="/vendor/hls.v1.7.3.min.js"></script><script defer src="/vendor/mediamtx-reader.v1.21.2.js"></script><script defer src="/overlay_logic.js"></script><script defer src="/preview.js"></script></head>
<body><header><div><h1>4G 主码流 · 算法预览</h1><div class="sub">连续原视频播放，仅显示安全帽与反光背心检测框</div></div><div><button id="restart">重新连接</button> <button id="full">全屏</button></div></header>
<main class="layout"><section class="panel"><div class="stage" id="stage"><video id="video" muted autoplay playsinline disablepictureinpicture></video><canvas id="overlay"></canvas></div><div class="bar"><span id="videoState">等待视频</span><span id="dimensions">—</span><span id="fps">显示帧率 —</span><span class="badge" id="overlayState">检测框等待有效播放时间锚</span></div><div class="bar"><label><input type="checkbox" id="enableOverlay"> 显示近似检测框</label><label>接收时钟偏移 <input type="number" id="offset" min="-10000" max="10000" step="50" style="width:95px"> ms</label><button id="timingReport">导出匹配报告</button></div></section>
<aside class="panel side"><h2>安全帽与反光背心数据</h2><div class="metric"><span>结果状态</span><strong id="dataState">等待</strong></div><div class="metric"><span>最新结果年龄</span><strong id="age">—</strong></div><div class="metric"><span>推理耗时</span><strong id="inference">—</strong></div><div class="metric"><span>源相对 PTS</span><strong id="pts">—</strong></div><div class="metric"><span>采样帧键</span><strong id="frameKey">—</strong></div><div class="metric"><span>PPE 检测框数</span><strong id="people">—</strong></div><div class="metric"><span>播放延迟估计</span><strong id="playDelay">—</strong></div><div class="metric"><span>播放与结果估计误差</span><strong id="matchError">—</strong></div><div class="note" id="timingNote">视频帧率与推理频率独立。检测框按服务器接收时间近似对齐，未通过精确同帧校准。时间锚无效、会话变化或结果过期时清框。</div><pre id="json">等待服务器检测 JSON</pre></aside></main></body></html>
