<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>球机 2 · 人脸打卡</title>
<style>body{font:16px/1.6 system-ui,sans-serif;color:#172334;background:#f4f6f8;margin:0}main{max-width:1080px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}a{color:#075eb4}section{background:white;border:1px solid #dce2e9;border-radius:12px;padding:22px;margin:20px 0}h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 14px}label{display:block;margin:14px 0 5px}input{font:inherit;padding:9px;max-width:95%;width:340px;border:1px solid #b8c4d1;border-radius:6px}input[type=file]{width:auto}button{font:inherit;padding:9px 20px;border:0;border-radius:7px;background:#075eb4;color:white;cursor:pointer;margin-top:18px}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:11px 7px;border-bottom:1px solid #e2e8ef}small,.muted{color:#596b7e}#message{white-space:pre-wrap}#state{padding:12px;background:#edf4fb;border-radius:7px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:750px){.columns{display:block}main{padding:15px}table{font-size:12px}}</style>
<main><header><h1>球机 2 · 人脸打卡</h1><a href="/" target="_blank">查看安全帽 / 反光背心视频 ↗</a></header><p class="muted">先录入人员，再面向摄像头打卡。同一人员每天只记一次首次打卡。</p><div id="state">正在读取设备状态…</div><p id="policy" class="muted">正在读取上班时间规则…</p><p id="liveness" role="status">正在读取活体检测状态…</p>
<div class="columns"><section><h2>录入人脸</h2><form id="enroll"><label for="person">人员编号</label><input id="person" required maxlength="64" pattern="[A-Za-z0-9_-]+" placeholder="如：员工工号"><label for="name">姓名</label><input id="name" required maxlength="40" autocomplete="off"><label for="photo">清晰正脸照片</label><input type="file" id="photo" accept="image/jpeg,image/png,image/webp" required><p><small>照片需完整、无遮挡，且只有一张人脸。录入时自动准备对应的姓名语音，录入过程不播放。</small></p><button id="submit">录入人员</button><p id="message" role="status"></p></form></section><section><h2>已录入人员</h2><table><thead><tr><th>编号</th><th>姓名</th><th>状态</th></tr></thead><tbody id="people"></tbody></table><p class="muted">仅识别已录入人员。陌生人、模糊或不确定的人脸不会生成打卡。</p></section></div>
<section><h2>最近打卡</h2><button type="button" id="clear-today" style="background:#934016;margin-top:0">清除今日打卡记录（测试）</button><p class="muted">仅清除此球机今天的记录，清除前自动归档，人脸库保留。清除后即可重新打卡；到08:00后，若人仍在镜头前，会按当前时间重新识别并播报。</p><p id="clear-message" role="status"></p><table><thead><tr><th>时间</th><th>编号</th><th>姓名</th><th>考勤状态</th><th>活体检查</th><th>语音</th></tr></thead><tbody id="records"></tbody></table></section></main>
<script>
const $=id=>document.getElementById(id),voiceNames={pending:'待播报',sending:'正在发送',submitted_unverified:'已发送，待确认听音',playback_confirmed:'已确认听到',failed_not_sent:'未发送',delivery_unknown:'播放结果待核实',expired_not_sent:'已过期，未播放'};
async function api(path,options){const r=await fetch('api/'+path,{cache:'no-store',...options});const data=await r.json();if(!r.ok)throw Error(data.message||data.error||'请求失败');return data;}
function row(cells){const tr=document.createElement('tr');for(const text of cells){const td=document.createElement('td');td.textContent=text;tr.append(td);}return tr;}
function attendanceLabel(x){if(x.attendance_status==='on_time')return '正常';if(x.attendance_status==='late'){const n=Math.max(1,Math.ceil(x.late_seconds||0));return `迟到 ${Math.floor(n/60)}分${n%60}秒`;}return '历史记录未判定';}
let refreshing=false;
async function refresh(){if(refreshing)return;refreshing=true;try{const data=await api('dashboard'),s=data.status;$('state').textContent=`视频${s.connected&&s.frame_age_seconds<3?'在线':'连接中'} · 已录入 ${s.enrolled_people} 人 · 语音${s.voice_enabled?'已启用':'待完成现场听音验证'}`;const p=s.attendance_policy,w=s.attendance_window;if(p)$('policy').textContent=`上班规则（北京时间）：${p.start}开始，${p.normal_until}:00（含）前正常，之后记迟到。${w?.attendance_status==='too_early'?'当前尚未到上班打卡时间，不记录、不播报。':''}`;const checks=s.liveness?.latest_matches||[];$('liveness').textContent=!s.liveness?.enabled?'活体检测未启用':checks.some(x=>x.state==='rejected')?'活体未通过：已拦截疑似照片，本次不打卡':checks.some(x=>x.state==='unknown')?'活体无法确认：请靠近并正对镜头':checks.length?'活体检查通过，正在核对打卡':'活体检测已启用：等待已录入人员';$('people').replaceChildren(...(data.people.length?data.people.map(x=>row([x.person_id,x.name,'已录入'])):[row(['—','暂无人员','请先录入'])]));$('records').replaceChildren(...(data.records.length?data.records.map(x=>row([new Date(x.occurred_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}),x.person_id,x.name,attendanceLabel(x),x.liveness_status==='passed'?'已通过':'旧记录未检查',voiceNames[x.voice_status]||x.voice_status])):[row(['—','—','暂无打卡','—','—','—'])]));}catch(e){$('state').textContent='暂时无法连接打卡服务，请稍后重试。';}finally{refreshing=false;}}
$('enroll').onsubmit=async e=>{e.preventDefault();const file=$('photo').files[0];if(!file||file.size>5*1024*1024){$('message').textContent='请使用不超过 5 MB 的照片。';return;}$('submit').disabled=true;$('message').textContent='正在检查人脸并准备姓名语音…';try{const photo=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file);});await api('enroll',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({person_id:$('person').value.trim(),name:$('name').value.trim(),photo_base64:photo})});$('message').textContent='录入成功，可以面向摄像头打卡。';$('photo').value='';await refresh();}catch(error){$('message').textContent='录入未完成：'+error.message;}finally{$('submit').disabled=false;}};refresh();setInterval(refresh,500);
$('clear-today').onclick=async()=>{const button=$('clear-today');button.disabled=true;$('clear-message').textContent='正在归档并清除今日记录…';try{const result=await api('attendance/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scope:'today',test_only:true})});$('clear-message').textContent=`已归档并清除 ${result.deleted} 条记录，可以重新面向摄像头打卡。`;await refresh();}catch(error){$('clear-message').textContent='清除未完成：'+error.message;}finally{button.disabled=false;}};
</script></html>
