<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#133e38" />
    <title>智慧工程 · 办公与安防管理平台</title>
    <script>
      if (location.hash === '#engineering' || location.hash.startsWith('#engineering?')) {
        const route = new URLSearchParams(location.hash.split('?')[1] || '');
        if (!route.has('view')) route.set('view', 'projects');
        const entry = new URL('/mobile/mobile.html', location.origin);
        entry.hash = 'engineering?' + route.toString();
        location.replace(entry.href);
      }
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
